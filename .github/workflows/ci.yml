name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pytest
          pip install -r requirements.txt || true

      - name: Run unit tests
        run: pytest tests/unit/ -v

      - name: Run guardrail tests
        run: pytest tests/execution/ -v

      - name: Run integration tests (requires Flask)
        run: |
          pip install flask || true
          pytest tests/integration/ -v || echo "Integration tests skipped (missing deps)"
